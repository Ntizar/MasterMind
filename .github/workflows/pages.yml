name: Desplegar a GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          exclude: |
            .git/
            .opencode/
            agents/
            learning-platform/
            design-system/
            docs/
            assets/
            scripts/
            verify-system.bat
            CONTRIBUTING.md
            README.md
            README_EN.md
            LICENSE

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
