<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Name Here</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1a202c; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.8em; margin-bottom: 8px; color: #2563eb; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        .upload-zone { background: white; border: 3px dashed #cbd5e1; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; margin-bottom: 20px; transition: all 0.3s; }
        .upload-zone:hover { border-color: #2563eb; background: #eff6ff; }
        .upload-zone.dragover { border-color: #2563eb; background: #dbeafe; transform: scale(1.02); }
        .files-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .file-card { background: white; border-radius: 12px; padding: 20px; border: 2px solid #e2e8f0; position: relative; }
        .file-card.loaded { border-color: #22c55e; }
        .file-type { font-size: 0.75em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 3px 10px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
        .file-type.word { background: #dbeafe; color: #2563eb; }
        .file-type.pdf { background: #fee2e2; color: #dc2626; }
        .action-btn { display: block; width: 100%; padding: 16px; font-size: 1.1em; font-weight: 700; color: white; background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3); }
        .action-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .result { background: white; border-radius: 16px; padding: 30px; margin-top: 20px; display: none; }
        .result.show { display: block; }
        .progress { display: none; text-align: center; padding: 20px; }
        .progress.show { display: block; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { text-align: center; margin-top: 40px; color: #94a3b8; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Tool Name</h1>
        <p class="subtitle">Description here</p>
        
        <div class="upload-zone" id="dropZone">
            <h2>📁 Arrastra archivos aquí</h2>
            <p>o haz clic para seleccionar</p>
        </div>
        
        <div class="files-grid" id="filesGrid" style="display:none;"></div>
        
        <button class="action-btn" id="actionBtn" disabled onclick="execute()">
            🔍 Ejecutar
        </button>
        
        <div class="progress" id="progress">
            <div class="spinner"></div>
            <p id="progressText">Procesando...</p>
        </div>
        
        <div class="result" id="result"></div>
        
        <footer>Hecho con ❤️ por David Antizar</footer>
    </div>

    <script>
    // ⚠️ PDF.js SIN worker — funciona desde file:// protocol
    pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    
    // === EXTRACCIÓN DE TEXTO ===
    async function extractWordText(file) {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        return result.value;
    }
    
    async function extractPDFText(file) {
        const arrayBuffer = await file.arrayBuffer();
        try {
            const pdf = await pdfjsLib.getDocument({ 
                data: arrayBuffer, 
                useSystemFonts: true,
                isEvalSupported: false 
            }).promise;
            
            let text = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(item => item.str).join(' ') + '\n';
            }
            return text;
        } catch(e) {
            throw new Error('No se pudo leer el PDF: ' + e.message);
        }
    }
    
    // === NORMALIZACIÓN LEGAL ===
    function normalizarLegal(texto) {
        if (!texto) return '';
        return texto
            .replace(/(?:^|\n)\s*\d{1,2}\.\s/g, '\n')
            .replace(/(?:^|\n)\s*\*\d{1,2}\.\s/g, '\n')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]/g, '');
    }
    
    function limpiarMetadataLegal(texto) {
        if (!texto) return '';
        const idx = texto.toLowerCase().indexOf('firman en la fecha');
        if (idx > 0) texto = texto.substring(0, idx);
        return texto.split('\n')
            .filter(l => !/PASEO|CASTELLANA|MADRID|28071|Página\s+\d/i.test(l))
            .filter(l => !/^[\s\-|*#=_]+$/.test(l))
            .join('\n');
    }
    
    // === DRAG & DROP ===
    // ... implement drag-drop, file management, UI ...
    
    async function execute() {
        // 1. Extract text
        // 2. Clean metadata
        // 3. Normalize
        // 4. Compare/process
        // 5. Show results
    }
    </script>
</body>
</html>
