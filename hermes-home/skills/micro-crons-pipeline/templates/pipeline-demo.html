<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏭 Micro-Crons Pipeline - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; min-height: 100vh; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2rem; background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; }
        .pipeline { background: rgba(30,41,59,0.8); border-radius: 1rem; padding: 2rem; margin: 1.5rem 0; border: 1px solid rgba(59,130,246,0.3); }
        .stages { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 1.5rem 0; }
        .stage { flex: 1; min-width: 140px; text-align: center; padding: 1.2rem; background: rgba(15,23,42,0.6); border-radius: 0.75rem; border: 2px solid transparent; transition: all 0.3s; }
        .stage.active { border-color: #3b82f6; background: rgba(59,130,246,0.1); transform: scale(1.05); }
        .stage.done { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .stage.pending { border-color: #64748b; opacity: 0.6; }
        .stage-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .stage-title { font-weight: 600; font-size: 0.85rem; }
        .arrow { font-size: 1.3rem; color: #3b82f6; align-self: center; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin: 1.5rem 0; }
        .stat { background: rgba(15,23,42,0.6); padding: 1.2rem; border-radius: 0.75rem; text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: 700; color: #3b82f6; }
        .stat-lbl { font-size: 0.8rem; color: #94a3b8; }
        .tasks { background: rgba(15,23,42,0.6); border-radius: 0.75rem; padding: 1.2rem; margin-top: 1.5rem; }
        .task { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; background: rgba(30,41,59,0.5); border-radius: 0.5rem; margin-bottom: 0.4rem; border-left: 4px solid transparent; }
        .task.pending { border-left-color: #64748b; }
        .task.active { border-left-color: #3b82f6; }
        .task.done { border-left-color: #22c55e; }
        .task-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .task.pending .task-dot { background: #64748b; }
        .task.active .task-dot { background: #3b82f6; animation: pulse 2s infinite; }
        .task.done .task-dot { background: #22c55e; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .task-info { flex: 1; }
        .task-name { font-weight: 500; font-size: 0.9rem; }
        .task-meta { font-size: 0.75rem; color: #94a3b8; }
        .controls { text-align: center; margin-top: 1.5rem; }
        .btn { padding: 0.7rem 1.4rem; border: none; border-radius: 0.5rem; font-size: 0.95rem; cursor: pointer; margin: 0.3rem; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .btn-secondary { background: rgba(100,116,139,0.3); color: #e2e8f0; border: 1px solid #64748b; }
        .console { background: #0f172a; border-radius: 0.75rem; padding: 1.2rem; margin-top: 1.5rem; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; border: 1px solid #334155; }
        .c-line { margin-bottom: 0.2rem; }
        .c-info { color: #60a5fa; }
        .c-ok { color: #4ade80; }
        footer { text-align: center; margin-top: 2rem; color: #64748b; font-size: 0.85rem; }
        @media (max-width: 768px) { .stages { flex-direction: column; } .arrow { transform: rotate(90deg); } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏭 Micro-Crons Pipeline</h1>
            <p class="subtitle">Línea de Montaje de Proyectos con Cron Jobs</p>
        </header>
        <section class="pipeline">
            <h2 style="text-align:center">Flujo del Pipeline</h2>
            <div class="stages">
                <div class="stage done"><div class="stage-icon">📝</div><div class="stage-title">Planificación</div></div>
                <div class="arrow">→</div>
                <div class="stage active"><div class="stage-icon">⚙️</div><div class="stage-title">Ejecución</div></div>
                <div class="arrow">→</div>
                <div class="stage pending"><div class="stage-icon">🔍</div><div class="stage-title">Validación</div></div>
                <div class="arrow">→</div>
                <div class="stage pending"><div class="stage-icon">✅</div><div class="stage-title">Completado</div></div>
            </div>
        </section>
        <section class="pipeline">
            <h2>📊 Estado: mi-dashboard</h2>
            <div class="stats">
                <div class="stat"><div class="stat-val" id="s-done">2</div><div class="stat-lbl">Completadas</div></div>
                <div class="stat"><div class="stat-val" id="s-active">1</div><div class="stat-lbl">En Progreso</div></div>
                <div class="stat"><div class="stat-val" id="s-pending">3</div><div class="stat-lbl">Pendientes</div></div>
                <div class="stat"><div class="stat-val" id="s-pct">33%</div><div class="stat-lbl">Progreso</div></div>
            </div>
            <div class="tasks" id="tasks"></div>
        </section>
        <div class="controls">
            <button class="btn btn-primary" onclick="runStep()">▶️ Siguiente Iteración</button>
            <button class="btn btn-secondary" onclick="reset()">🔄 Reset</button>
        </div>
        <div class="console" id="log"><div class="c-line c-info">ℹ️ Pipeline inicializado...</div></div>
        <footer>Hecho con ❤️ por David Antizar</footer>
    </div>
    <script>
        const T = [
            {id:"task-001",name:"Estructura HTML base",st:"done",pri:"alta"},
            {id:"task-002",name:"CSS variables y reset",st:"done",pri:"alta"},
            {id:"task-003",name:"Gráfico Chart.js",st:"active",pri:"media"},
            {id:"task-004",name:"Notificaciones",st:"pending",pri:"baja"},
            {id:"task-005",name:"Exportar PDF",st:"pending",pri:"baja"},
            {id:"task-006",name:"Documentación",st:"pending",pri:"baja"}
        ];
        function render(){
            document.getElementById("tasks").innerHTML=T.map(t=>`<div class="task ${t.st}"><div class="task-dot">${t.st==='done'?'✓':t.st==='active'?'◉':'○'}</div><div class="task-info"><div class="task-name">${t.name}</div><div class="task-meta">${t.id} • ${t.pri}</div></div></div>`).join("");
            const d=T.filter(t=>t.st==='done').length,a=T.filter(t=>t.st==='active').length,p=T.filter(t=>t.st==='pending').length;
            document.getElementById("s-done").textContent=d;
            document.getElementById("s-active").textContent=a;
            document.getElementById("s-pending").textContent=p;
            document.getElementById("s-pct").textContent=Math.round(d/T.length*100)+'%';
        }
        function log(cls,msg){const l=document.getElementById("log");l.innerHTML+=`<div class="c-line ${cls}">${msg}</div>`;l.scrollTop=l.scrollHeight;}
        function runStep(){
            const cur=T.find(t=>t.st==='active');
            if(cur){log("c-info",`⚙️ Ejecutando: ${cur.name}...`);setTimeout(()=>{cur.st='done';log("c-ok",`✅ Completada: ${cur.name}`);const nx=T.find(t=>t.st==='pending');if(nx){nx.st='active';log("c-info",`▶️ Iniciando: ${nx.name}`);}else{log("c-ok","🎉 ¡Proyecto terminado!");}render();},1200);}
            else{const nx=T.find(t=>t.st==='pending');if(nx){nx.st='active';log("c-info",`▶️ Iniciando: ${nx.name}`);render();}else{log("c-ok","🎉 No hay más tareas.");}}
        }
        function reset(){T[0].st='done';T[1].st='done';T[2].st='active';T[3].st='pending';T[4].st='pending';T[5].st='pending';document.getElementById("log").innerHTML='<div class="c-line c-info">ℹ️ Reiniciado...</div>';render();}
        render();
    </script>
</body>
</html>
